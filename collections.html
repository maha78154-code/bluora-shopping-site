<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluora - Collections</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-tabs { margin-bottom: 25px; display: flex; gap: 15px; }
        .filter-btn { padding: 8px 18px; background: #ffffff; border: 2px solid #2874f0; color: #2874f0; font-weight: 600; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: #2874f0; color: #ffffff; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: #ffffff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 6px; }
        .product-info h4 { font-size: 16px; margin: 10px 0 5px; color: #212121; }
        .product-info .price { font-size: 18px; font-weight: bold; color: #388e3c; margin-bottom: 10px; }
        .product-card button { background: #ff9f00; color: white; border: none; padding: 10px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .product-card button:hover { background: #fb641b; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Bluora</h1>
            <span style="font-size: 12px; color: #ffe11b; font-style: italic;">Explore Plus</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="collections.html" class="active-nav"><i class="fa-solid fa-shirt"></i> Collections</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About Us</a></li>
                <li><a href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        <h2 class="section-title">Our Exclusive Dress Collections</h2>
        <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterCategory('all', this)">All Products</button>
            <button class="filter-btn" onclick="filterCategory('female', this)">Female Collections</button>
            <button class="filter-btn" onclick="filterCategory('male', this)">Male Collections</button>
        </div>

        <div class="product-grid" id="product-grid">
            <!-- Populated via JS -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bluora Online Shopping. All Rights Reserved.</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Indo-Western Silk Kurti", category: "female", price: 899, image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Floral Printed Anarkali", category: "female", price: 1299, image: "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Designer Party Wear Lehenga", category: "female", price: 2499, image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "Cotton Casual Kurti", category: "female", price: 599, image: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "Men's Slim Fit Casual Shirt", category: "male", price: 799, image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "Men's Formal Cotton Blazer", category: "male", price: 2199, image: "https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "Men's Ethnic Kurta Pyjama", category: "male", price: 1199, image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=600&q=80" },
            { id: 8, name: "Men's Casual Denim Jacket", category: "male", price: 1499, image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=600&q=80" }
        ];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-info">
                            <h4>${product.name}</h4>
                            <div class="price">₹${product.price}</div>
                        </div>
                    </div>
                    <button onclick="addToCart(${product.id})"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts(category);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            let cart = JSON.parse(localStorage.getItem('bluoraCart')) || [];
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('bluoraCart', JSON.stringify(cart));
            alert(`Successfully added "${product.name}" to your cart!`);
        }

        window.onload = () => renderProducts('all');
    </script>
</body>
</html>
