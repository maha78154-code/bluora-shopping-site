<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluora - Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .cart-items-list { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .cart-item-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #e0e0e0; }
        .cart-item-row img { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; }
        .cart-summary { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); height: fit-content; }
        .cart-summary h3 { border-bottom: 2px solid #f1f3f6; padding-bottom: 10px; margin-bottom: 15px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .summary-row.total { font-weight: bold; font-size: 18px; color: #2874f0; border-top: 1px dashed #ccc; padding-top: 10px; }
        .checkout-btn { background: #fb641b; color: white; width: 100%; padding: 12px; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        .checkout-btn:hover { background: #e55310; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1>Bluora</h1>
            <span style="font-size: 12px; color: #ffe11b; font-style: italic;">Explore Plus</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="collections.html"><i class="fa-solid fa-shirt"></i> Collections</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="cart.html" class="active-nav"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About Us</a></li>
                <li><a href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        <h2 class="section-title">Shopping Cart</h2>
        <div class="cart-layout">
            <div class="cart-items-list" id="cart-items-container">
                <p style="color: #666; text-align: center; padding: 30px;">Your cart is currently empty.</p>
            </div>
            <div class="cart-summary" id="cart-summary-box" style="display: none;">
                <h3>Price Details</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Charges</span>
                    <span style="color: #388e3c; font-weight: 600;">FREE</span>
                </div>
                <div class="summary-row total">
                    <span>Total Amount</span>
                    <span id="summary-total">₹0</span>
                </div>
                <button class="checkout-btn" onclick="checkoutOrder()">Place Order & Ship</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bluora Online Shopping. All Rights Reserved.</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('bluoraCart')) || [];
            const container = document.getElementById('cart-items-container');
            const summaryBox = document.getElementById('cart-summary-box');

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 30px;">Your cart is currently empty.</p>';
                summaryBox.style.display = 'none';
                return;
            }

            summaryBox.style.display = 'block';
            container.innerHTML = '';
            let subtotal = 0;

            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                const row = document.createElement('div');
                row.className = 'cart-item-row';
                row.innerHTML = `
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                            <h4 style="margin-bottom: 4px; font-size: 15px;">${item.name}</h4>
                            <p style="color: #388e3c; font-weight: bold; margin-bottom: 0;">₹${item.price} x ${item.quantity}</p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background: #ff3e6c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(row);
            });

            document.getElementById('summary-subtotal').textContent = `₹${subtotal}`;
            document.getElementById('summary-total').textContent = `₹${subtotal}`;
        }

        function removeFromCart(productId) {
            let cart = JSON.parse(localStorage.getItem('bluoraCart')) || [];
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('bluoraCart', JSON.stringify(cart));
            loadCart();
        }

        function checkoutOrder() {
            let cart = JSON.parse(localStorage.getItem('bluoraCart')) || [];
            if (cart.length === 0) return;

            let orders = JSON.parse(localStorage.getItem('bluoraOrders')) || [];
            const orderId = '#BLU-' + Math.floor(10000 + Math.random() * 90000);
            const dateStr = new Date().toLocaleDateString();

            cart.forEach(item => {
                orders.unshift({
                    orderId: orderId,
                    name: item.name,
                    price: item.price,
                    image: item.image,
                    date: dateStr,
                    status: "Ordered Successful! Your product has been shipped!"
                });
            });

            localStorage.setItem('bluoraOrders', JSON.stringify(orders));
            localStorage.removeItem('bluoraCart');

            alert("Ordered Successful! Your product has been shipped!");
            window.location.href = "orders.html";
        }

        window.onload = loadCart;
    </script>
</body>
</html>
